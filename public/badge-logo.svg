<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.5" filter="url(#glow)" />
  <rect x="14" y="14" width="92" height="92" rx="24" fill="none" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.3" />

  <!-- Central Starburst & Medal Glyph -->
  <circle cx="60" cy="54" r="24" fill="#1E3A8A" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Star / Sparkle Icon inside circle -->
  <path d="M60 38 L63.5 48.5 L74.5 48.5 L65.5 55 L69 65.5 L60 59 L51 65.5 L54.5 55 L45.5 48.5 L56.5 48.5 Z" fill="url(#goldGrad)" />

  <!-- Ribbon Below -->
  <path d="M42 74 L60 84 L78 74 L78 88 L60 96 L42 88 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1" />
  <circle cx="60" cy="84" r="3" fill="#FFFFFF" />
</svg>
